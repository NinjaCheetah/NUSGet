# This workflow will install Python dependencies and then build NUSGet for all platforms

name: Tag Python application

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build-linux-x86_64:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Install system deps for Nuitka
      run: |
        sudo apt update && \
        sudo apt install -y ccache patchelf
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Package
      run: make all
    - name: Prepare Package for Upload
      run: |
        mv NUSGet ~/NUSGet
        cd ~
        tar cvf NUSGet.tar NUSGet
    - name: Upload Package
      uses: actions/upload-artifact@v7
      with:
        path: ~/NUSGet.tar
        name: NUSGet-Linux-x86_64-bin

  build-macos-x86_64:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Package
        run: ARCH_FLAGS=--macos-target-arch=x86_64 make all
      - name: Prepare Package for Upload
        run: |
          mv NUSGet.app ~/NUSGet.app
          cd ~
          tar cvf NUSGet.tar NUSGet.app
      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          path: ~/NUSGet.tar
          name: NUSGet-macOS-x86_64-bin

  build-macos-arm64:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build Package
        run: ARCH_FLAGS=--macos-target-arch=arm64 make all
      - name: Prepare Package for Upload
        run: |
          mv NUSGet.app ~/NUSGet.app
          cd ~
          tar cvf NUSGet.tar NUSGet.app
      - name: Upload Package
        uses: actions/upload-artifact@v7
        with:
          path: ~/NUSGet.tar
          name: NUSGet-macOS-arm64-bin

  build-windows-x86_64:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Standalone Package
      run: .\Build.ps1
    - name: Upload Unsigned Standalone Package
      id: upload-unsigned-standalone
      uses: actions/upload-artifact@v7
      with:
        path: D:\a\NUSGet\NUSGet\NUSGet.dist
        name: NUSGet-Windows-x86_64-bin
    - name: Sign Standalone Package (TESTING)
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: 'c162cb9c-9ce8-4539-a7ed-08527a44249f'
        project-slug: 'NUSGet'
        signing-policy-slug: 'test-signing'
        github-artifact-id: '${{ steps.upload-unsigned-standalone.outputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: '.\signed-package'
    - name: Upload Signed Standalone Package
      uses: actions/upload-artifact@v7
      with:
        path: .\signed-package
        name: NUSGet-Windows-x86_64-signed-bin

  build-windows-onefile-x86_64:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Onefile Package
      run: .\Build.ps1 build-onefile
    - name: Upload Unsigned Onefile Package
      id: upload-unsigned-onefile
      uses: actions/upload-artifact@v7
      with:
        path: D:\a\NUSGet\NUSGet\NUSGet.exe
        name: NUSGet-Windows-onefile-x86_64-bin
    - name: Sign Onefile Package (TESTING)
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
        organization-id: 'c162cb9c-9ce8-4539-a7ed-08527a44249f'
        project-slug: 'NUSGet'
        signing-policy-slug: 'test-signing'
        github-artifact-id: '${{ steps.upload-unsigned-onefile.outputs.artifact-id }}'
        wait-for-completion: true
        output-artifact-directory: '.\signed-package'
    - name: Upload Signed Onefile Package
      uses: actions/upload-artifact@v7
      with:
        path: .\signed-package\NUSGet.exe
        name: NUSGet-Windows-onefile-x86_64-signed-bin
        
